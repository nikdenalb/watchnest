name: WatchNest pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    name: CI / full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew test --no-daemon

      - name: Run frontend unit tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  publish_images:
    name: Publish GHCR images
    needs: quality_gate
    if: >
      github.repository == 'nikdenalb/watchnest' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/nikdenalb/watchnest-app
      WEB_IMAGE: ghcr.io/nikdenalb/watchnest-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikdenalb/watchnest
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=watchnest-app
          cache-to: type=gha,mode=max,scope=watchnest-app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nikdenalb/watchnest
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=watchnest-web
          cache-to: type=gha,mode=max,scope=watchnest-web
